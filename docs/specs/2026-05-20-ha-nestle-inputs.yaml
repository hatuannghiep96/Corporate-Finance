# ── COMPANY-SPECIFIC CONTEXT (Part B placeholders) ────────────────────────────

STRUCTURAL_NOTES: >
  Net working capital is negative: currentYear_working_capital_net = (8,725) CHF M.
  This is structurally normal for Nestlé — the company operates with negative NWC
  due to 90-day supplier payment terms (global parent company policy) combined with
  ~46-day retail collection periods. Do not treat as a liquidity concern.
  The real liquidity buffer is CHF 15.9B in annual operating cash flow.

MANAGEMENT_ROIC_NOTE: >
  Nestlé's management-reported ROIC was 14.1% in FY2024. Compare template ROC
  to this figure and explain the ~1.7 percentage point difference: management uses
  invested capital (net debt + equity) while the template uses total capitalization
  (long-term debt + equity) on an average basis.

INDUSTRY_COLLECTION_NORM: "30–45 days (FMCG industry)"

COLLECTION_PERIOD_CONTEXT: >
  Nestlé's large retail counterparties (Walmart, Carrefour, Tesco) negotiate
  extended payment terms as a condition of shelf space. A collection period
  at the upper edge of the norm reflects this structural dynamic, not weak
  receivables management.

MANAGEMENT_OPERATING_MARGIN: "14.2% (FY2025 trading operating profit margin)"

MANAGEMENT_LEVERAGE_NOTE: >
  Management's net debt/EBITDA was 2.90x (FY2024) — at the top of the stated
  2–3x target range. Note that management's definition nets cash from gross debt;
  the template's debt ratio uses total liabilities, producing a different absolute
  figure (74.0%) that is not directly comparable to the net debt/EBITDA metric.

LIQUIDITY_CONTEXT: >
  Current ratio below 1.0x is expected given Nestlé's negative NWC structure
  driven by 90-day supplier payment terms. Interpret liquidity through the lens
  of CHF 15.9B annual operating cash flow, not the balance sheet ratios alone.

LEVERAGE_SUSTAINABILITY_NOTE: >
  Cross-reference net debt/EBITDA 2.90x (FY2024) and management's stated 2–3x
  target range. At the top of that range, the leverage factor of ~3.85x has
  limited room to expand further without triggering a rating review.

RECOMMENDATION_THEMES: |
  1. Leverage reduction — net debt/EBITDA 2.90x at top of target range; CHF 15.9B
     operating CF creates opportunity to accelerate debt repayment.
  2. Margin recovery — trading operating margin fell from 16.0% (FY2024) to 14.2%
     (FY2025); "Fuel for Growth" CHF 2.5B cost reduction program progress to evaluate.
  3. Asset efficiency — goodwill + intangibles CHF 44.3B (35% of total assets);
     portfolio rationalization could improve asset turnover from 0.64x.
  4. Working capital discipline — negative NWC of (CHF 8.7B) reflects 90-day supplier
     terms; maintaining this advantage protects operating cash flow.
  5. Capital allocation — FY2025 buybacks CHF 213M vs CHF 4.7B FY2024 (program
     complete); evaluate dividend growth vs debt reduction vs M&A.

