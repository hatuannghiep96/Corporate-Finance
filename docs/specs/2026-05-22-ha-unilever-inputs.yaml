# ── COMPANY-SPECIFIC CONTEXT ──────────────────────────────────────────────────

STRUCTURAL_NOTES: >
  Unilever demerged its Ice Cream business (The Magnum Ice Cream Company) in 2025.
  All FY2025 figures are on a continuing operations basis (Beauty & Wellbeing,
  Personal Care, Home Care, Foods). FY2024 comparatives have been restated to
  reflect the demerger. The discontinued operations generated a gain of €3,373M
  on disposal — excluded from continuing operations analysis.
  NWC is negative: currentYear_working_capital_net = 17,066 - 21,662 = (4,596) EUR M.
  This is structurally driven by large trade payables to retailer networks.

MANAGEMENT_ROIC_NOTE: >
  Unilever reports underlying ROIC (return on invested capital) as a non-GAAP measure.
  Compare template ROC to management's high-teens ROIC ambition stated in the 2025
  value creation plan. Note that Unilever's ROIC definition uses underlying operating
  profit (excluding restructuring, impairments, disposals) while the template uses
  after-tax operating income including all items.

INDUSTRY_COLLECTION_NORM: "30–45 days (FMCG industry)"

COLLECTION_PERIOD_CONTEXT: >
  Unilever's retail counterparty base (major grocery chains in Europe, US, Asia)
  typically negotiates payment terms of 30–60 days. Collection period above 45 days
  reflects exposure to longer-terms markets in emerging economies.

MANAGEMENT_OPERATING_MARGIN: >
  Unilever's underlying operating margin (UOM) for FY2025 — refer to Additional
  Financial Disclosures pages 40-46 of the Annual Report. Reported operating profit
  margin = 9,037 / 50,503 = 17.9%. Template figure will differ as it uses
  after-tax operating income.

MANAGEMENT_LEVERAGE_NOTE: >
  Unilever targets ~2x net debt/EBITDA per its value creation plan. Financial
  liabilities: current 2,582 + non-current 25,696 = 28,278 gross debt. Net of
  cash 3,941 + financial assets 1,121 = 5,062: net debt ≈ 23,216 EUR M.

LIQUIDITY_CONTEXT: >
  Current ratio below 1.0x (17,066 / 21,662 = 0.79x) is structurally normal for
  Unilever — large trade payables to retail customers drive negative NWC.
  Operating cash flow from continuing ops (net of tax) = EUR 8,052M provides
  the real liquidity buffer. Direct comparison to Nestlé's 0.786x current ratio
  is meaningful — both companies use supplier financing as a structural advantage.

LEVERAGE_SUSTAINABILITY_NOTE: >
  Unilever targets ~2x net debt/EBITDA per value creation plan vs Nestlé's 2–3x
  target. Compare leverage ratios and EVA headroom between the two peers.
  Key difference: Unilever's balance sheet was significantly reshaped by the
  Ice Cream demerger — total assets fell from €79.8B to €70.5B and goodwill
  dropped €4.6B as Ice Cream brands were derecognised.

RECOMMENDATION_THEMES: |
  1. Portfolio focus dividend — Ice Cream demerger complete; evaluate whether remaining
     four business groups (Beauty & Wellbeing, Personal Care, Home Care, Foods) show
     improved asset turnover vs pre-demerger baseline.
  2. Margin expansion — underlying operating margin trajectory; "Fuel for Growth"
     equivalent is Unilever's productivity programme (€710M restructuring in FY2024).
  3. WACC headroom vs Nestlé — compare EVA break-even WACC for both companies;
     which has more value-creation headroom under stress?
  4. Working capital comparison — Nestlé NWC (CHF 8,725M) vs Unilever NWC (EUR 4,596M);
     relative supplier financing advantage as % of revenue.
  5. Capital allocation post-demerger — €4.3B dividends + €1.5B buybacks in FY2025;
     evaluate vs Nestlé's dividend + buyback policy.

